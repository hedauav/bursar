# The agent's heartbeat.
#
# Vercel Hobby only permits a daily cron, which is too slow to watch an agent
# manage a budget. This workflow drives the same endpoint every 15 minutes, so
# the agent genuinely wakes up, reads its own runway, and transacts on its own
# schedule with no human involved.
name: agent tick

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the agent
        env:
          AGENT_URL: ${{ secrets.AGENT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$AGENT_URL" ]; then
            echo "AGENT_URL secret not set; skipping."
            exit 0
          fi
          code=$(curl -s -o response.json -w '%{http_code}' --max-time 280 \
            -H "authorization: Bearer $CRON_SECRET" \
            "$AGENT_URL/api/cron/tick")
          echo "HTTP $code"
          cat response.json
          echo
          [ "$code" = "200" ]
